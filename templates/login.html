<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Procurement Workflow - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container">

    <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh;"
    >

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <div class="text-center mb-4">

                        <h3>
                            Procurement Workflow
                        </h3>

                        <p class="text-muted mb-0">
                            Sign in to continue
                        </p>

                    </div>


                    <!-- ================================================= -->
                    <!-- FLASH MESSAGES -->
                    <!-- ================================================= -->

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                    role="alert"
                                >

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- ================================================= -->
                    <!-- LOGIN FORM -->
                    <!-- ================================================= -->

                    <form
                        method="POST"
                        action="{{ url_for('login') }}"
                    >


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >

                                Organization Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="yourname@company.com"
                                required
                                autofocus
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >

                                Password

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >

                            Login

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
